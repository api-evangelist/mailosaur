  pub.dev) plus the Mailosaur GitHub organization
  (https://github.com/mailosaur) and https://mailosaur.com/docs/automation
notes:
  - >-
    Mailosaur maintains one first-party client library per language, all under
    the github.com/mailosaur organization and all linked from the official
    automation docs. Eight of the ten libraries were re-released together on
    2026-05-27, so the SDK fleet is current with the API rather than trailing it.
  - >-
    mailosaur-swift is distributed only through Swift Package Manager (a git tag,
    no central registry), and Swift Package Index carries no queryable release
    metadata endpoint, so `version` is recorded null rather than guessed.
  - >-
    The Dart client (pub.dev/packages/mailosaur, 1.0.1) is the oldest release in
    the fleet — 2025-04-24, more than a year behind the 2026-05-27 group release.
